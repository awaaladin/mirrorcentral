[project]
name = "mirror-backend"
version = "0.1.0"
description = "Mirror Pro/business backend: server-side render enhancement, accounts, and entitlements."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "redis>=5.2,<6.0",
    "arq>=0.26,<1.0",
    "boto3>=1.35,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 can't read bcrypt's version probe on 4.1+ (harmless but noisy)
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "jinja2>=3.1,<4.0",
    "itsdangerous>=2.2,<3.0",
    "replicate>=1.0,<2.0",
    "pillow>=11.0,<12.0",
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Security() (and our own require_role() factory) are meant to be
# called in argument defaults — that's how the dependency-injection system works, not
# a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Security", "app.admin.deps.require_role"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
