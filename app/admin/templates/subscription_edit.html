{% extends "base.html" %}
{% block title %}Edit Subscription · Mirror Admin{% endblock %}
{% block content %}
<a href="/admin/users/{{ user.id }}" class="text-sm text-on-surface-variant hover:underline">← {{ user.email }}</a>
<h1 class="font-serif text-3xl mt-2 mb-6">Edit Subscription</h1>

<form method="post" action="/admin/subscriptions/{{ subscription.id }}/edit"
      class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 max-w-md flex flex-col gap-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Plan</label>
    <select name="plan" class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
      {% for p in plans %}
      <option value="{{ p.value }}" {% if subscription.plan == p %}selected{% endif %}>{{ p.value }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Status</label>
    <select name="status" class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
      {% for s in statuses %}
      <option value="{{ s.value }}" {% if subscription.status == s %}selected{% endif %}>{{ s.value }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Renews At</label>
    <input type="datetime-local" name="renews_at"
           value="{{ subscription.renews_at.strftime('%Y-%m-%dT%H:%M') if subscription.renews_at else '' }}"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
  </div>

  <button type="submit" class="bg-primary-container text-on-primary-container rounded py-2.5 font-medium uppercase text-xs tracking-widest hover:bg-primary transition-colors">
    Save changes
  </button>
</form>
{% endblock %}
