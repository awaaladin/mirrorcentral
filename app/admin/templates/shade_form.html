{% extends "base.html" %}
{% block title %}{{ 'Edit' if shade else 'New' }} Shade · Mirror Admin{% endblock %}
{% block content %}
<a href="/admin/shades" class="text-sm text-on-surface-variant hover:underline">← Shade Library</a>
<h1 class="font-serif text-3xl mt-2 mb-6">{{ 'Edit' if shade else 'New' }} Shade</h1>

<form method="post" action="{{ '/admin/shades/' ~ shade.id ~ '/edit' if shade else '/admin/shades/new' }}"
      class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 max-w-md flex flex-col gap-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Name</label>
    <input type="text" name="name" required value="{{ shade.name if shade else '' }}"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Hex Color</label>
    <input type="text" name="hex_color" required placeholder="#B85C38" value="{{ shade.hex_color if shade else '' }}"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white font-mono">
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Category</label>
    <select name="category" class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
      {% for c in categories %}
      <option value="{{ c.value }}" {% if shade and shade.category == c %}selected{% endif %}>{{ c.value }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Finish</label>
    <select name="finish" class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
      {% for f in finishes %}
      <option value="{{ f.value }}" {% if shade and shade.finish == f %}selected{% endif %}>{{ f.value }}</option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="bg-primary-container text-on-primary-container rounded py-2.5 font-medium uppercase text-xs tracking-widest hover:bg-primary transition-colors">
    {{ 'Save changes' if shade else 'Create shade' }}
  </button>
</form>
{% endblock %}
