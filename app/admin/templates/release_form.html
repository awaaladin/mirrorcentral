{% extends "base.html" %}
{% block title %}Publish Release · Mirror Admin{% endblock %}
{% block content %}
<a href="/admin/releases" class="text-sm text-on-surface-variant hover:underline">← App Releases</a>
<h1 class="font-serif text-3xl mt-2 mb-6">Publish a Release</h1>

<form method="post" action="/admin/releases/new"
      class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 max-w-md flex flex-col gap-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Platform</label>
    <select name="platform" class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
      {% for p in platforms %}
      <option value="{{ p.value }}">{{ p.value }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Version code</label>
    <input type="number" name="version_code" required placeholder="e.g. 7 (must be higher than the last release)"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Version name</label>
    <input type="text" name="version_name" required placeholder="e.g. 1.3.0"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Download URL</label>
    <input type="url" name="download_url" required placeholder="https://.../mirror-1.3.0.apk"
           class="w-full border border-outline-variant rounded px-3 py-2 bg-white">
    <p class="text-xs text-on-surface-variant mt-1">The .apk's public R2 URL (or wherever it's hosted) — this is exactly what the app and landing page download button link to.</p>
  </div>

  <div>
    <label class="eyebrow uppercase text-xs text-on-surface-variant block mb-1">Release notes</label>
    <textarea name="release_notes" rows="3" class="w-full border border-outline-variant rounded px-3 py-2 bg-white"></textarea>
  </div>

  <label class="flex items-center gap-2 text-sm">
    <input type="checkbox" name="is_mandatory" value="true">
    Mandatory update (app blocks use until the user updates)
  </label>

  <button type="submit" class="bg-primary-container text-on-primary-container rounded py-2.5 font-medium uppercase text-xs tracking-widest hover:bg-primary transition-colors">
    Publish &amp; notify devices
  </button>
</form>
{% endblock %}
